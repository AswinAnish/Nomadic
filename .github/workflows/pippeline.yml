name: Print VM IP

on:
  workflow_dispatch:  # Enables manual trigger from GitHub Actions UI

jobs:
  show-vm-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Print public IP address
        run: |
          echo "Public IP:"
          curl -s https://api.ipify.org

      - name: Print private IP address
        run: |
          echo "Private IP:"
          hostname -I
